name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f .gitignore
          test -f .env.example

      - name: Ensure .env is not committed
        run: |
          if [ -f .env ]; then
            echo ".env must not be committed. Use .env.example instead."
            exit 1
          fi
